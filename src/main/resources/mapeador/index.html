function campoAvancado(c, n, i) {
  return h('input', {
    type: 'text', class: 'mono', value: n.texto, placeholder: 'ex.: ECD@ECF@!ANTIGO', 'data-foco': 'avancado-' + c.id + '-' + i,
    oninput: ev => {
      n.texto = ev.target.value;
      atualizarNomeAutomatico(c);
      marcarSujo();
      agendarPrevia(700);
      clearTimeout(relogioDoAvancado);
      relogioDoAvancado = setTimeout(renderCaminhos, 500);
    }
  });
}

function painelDeNomes(c, n, i) {
  const box = h('div', { class: 'nomes' });
  const chave = chaveDosNomes(c, i);
  if (!chave) {
    box.append(h('p', { class: 'dica' }, 'Termine os níveis de cima para ver as pastas deste nível.'));
    return box;
  }
  const dados = S.nomes.get(chave.id);
  if (!dados) {
    box.append(h('p', { class: 'dica' }, icone('girar', 'girando'), ' Procurando as pastas deste nível…'));
    buscarNomes(chave);
    return box;
  }

  const filtro = S.filtrosNomes.get(c.id + '-' + i) || '';
  const onde = i === 0
    ? 'na pasta inicial'
    : dados.pastasNoNivelAcima === 1 ? 'em 1 pasta do nível de cima' : 'somando ' + plural(dados.pastasNoNivelAcima, 'pasta', 'pastas') + ' do nível de cima';
  const cab = h('div', { class: 'nomes-cab' },
    h('span', { class: 'nomes-titulo' }, 'Pastas que existem neste nível'),
    h('span', { class: 'nomes-conta' }, plural(dados.totalDeNomes, 'nome', 'nomes') + ', ' + onde));
  if (dados.nomes.length > 12) {
    cab.append(h('input', {
      type: 'search', placeholder: 'filtrar…', value: filtro, 'data-foco': 'filtro-' + c.id + '-' + i,
      oninput: ev => {
        S.filtrosNomes.set(c.id + '-' + i, ev.target.value);
        const alvo = normalizar(ev.target.value);
        for (const el of box.querySelectorAll('.nome')) el.hidden = alvo !== '' && !el.dataset.filtro.includes(alvo);
      }
    }));
  }
  box.append(cab);
  if (dados.erro) box.append(h('div', { class: 'caixa-erro' }, icone('erro'), h('div', {}, dados.erro)));

  if (!dados.nomes.length) {
    box.append(h('p', { class: 'dica' }, dados.pastasNoNivelAcima
      ? 'Nenhuma pasta neste nível: as pastas do nível de cima estão vazias.'
      : 'Nenhuma pasta chega até aqui: as regras dos níveis de cima não encontram nada.'));
    return box;
  }

  const alvoFiltro = normalizar(filtro);
  const lista = h('div', { class: 'nomes-lista' });
  for (const item of dados.nomes) {
    const classe = item.doRobo ? 'do-robo' : item.aceita ? 'entra' : 'fora';
    const titulo = item.doRobo
      ? 'Pasta de trabalho do robô'
      : (item.aceita ? 'O robô entra' : 'O robô não entra') + (item.quantidade > 1 ? ' (existe em ' + item.quantidade + ' pastas)' : '');
    lista.append(h('button', {
        class: 'nome ' + classe, title: titulo, 'data-filtro': normalizar(item.nome),
        hidden: alvoFiltro !== '' && !normalizar(item.nome).includes(alvoFiltro),
        onclick: () => clicarNome(c, n, i, item, dados)
      },
      icone(item.aceita ? 'check' : 'menos'),
      h('span', {}, item.nome),
      item.quantidade > 1 ? h('span', { class: 'nome-qtd' }, '×' + item.quantidade) : null));
  }
  box.append(lista);
  const rodape = [];
  if (dados.totalDeNomes > dados.nomes.length) rodape.push('Mostrando os primeiros ' + dados.nomes.length + ' nomes.');
  rodape.push(n.modo === 'todas'
    ? 'Clique num nome para deixá-lo de fora.'
    : n.modo === 'nomes' || n.modo === 'menos'
      ? 'Clique num nome para colocá-lo ou tirá-lo.'
      : 'Verde: o robô entra. Riscado: fica de fora.');
  box.append(h('div', { class: 'nomes-rodape' }, rodape.join(' ')));
  return box;
}

// ------------------------------------------------------------------------------- resultado

function resumoDoResultado() {
  const p = S.previa;
  if (!S.caminhos.length) return { tipo: 'neutro', icone: 'info', titulo: 'Nenhum caminho ainda', sub: 'Escolha uma pasta de guias na árvore para começar.' };
  if (S.previaStatus === 'calculando') return { tipo: 'neutro', icone: 'girar', girando: true, titulo: 'Conferindo as pastas do cliente…', sub: 'Numa pasta de rede grande isso pode levar alguns segundos.' };
  if (S.previaStatus === 'falhou') return { tipo: 'erro', icone: 'erro', titulo: 'Não foi possível conferir', sub: S.previaFalha || '' };
  if (S.previaStatus === 'vazia' || !p) return { tipo: 'aviso', icone: 'alerta', titulo: 'Nada para conferir', sub: 'Todos os caminhos estão incompletos ou com erro.' };
  if (p.totalDeAlvos === 0) return { tipo: 'aviso', icone: 'alerta', titulo: 'Nenhuma pasta encontrada', sub: 'Com este mapa o robô não enviaria nada. Confira os níveis dos caminhos.' };
  return {
    tipo: 'ok', icone: 'check',
    titulo: 'O robô vai monitorar ' + plural(p.totalDeAlvos, 'pasta', 'pastas'),
    sub: plural(p.pastasVisitadas, 'pasta conferida', 'pastas conferidas') + ' na árvore do cliente'
  };
}

function avisosDoResultado() {
  const avisos = [];
  for (const c of S.caminhos) {
    const s = situacaoDoCaminho(c);
    if (s.tipo === 'incompleto') avisos.push({ tipo: 'erro', texto: 'O caminho ' + aspas(nomeDe(c)) + ' está incompleto (' + s.texto + ') e ficou de fora.', caminho: c.id });
    if (s.tipo === 'erro') avisos.push({ tipo: 'erro', texto: 'O robô não aceita o caminho ' + aspas(nomeDe(c)) + ': ' + s.texto, caminho: c.id });
    if (s.tipo === 'zero') avisos.push({ tipo: 'aviso', texto: 'O caminho ' + aspas(nomeDe(c)) + ' não encontrou nenhuma pasta.', caminho: c.id });
  }
  const p = S.previaStatus === 'pronta' ? S.previa : null;
  if (p && p.semAcesso.length) {
    avisos.push({
      tipo: 'aviso', chave: 'sem-acesso',
      texto: 'Sem permissão para abrir ' + plural(p.semAcesso.length, 'pasta', 'pastas') + '.',
      detalhe: 'O usuário ' + S.cfg.usuario + ' não consegue abrir estas pastas, então o que há dentro delas ficou de fora. O serviço do robô pode ter outras permissões.',
      itens: p.semAcesso.map(rel => ({ rel, texto: caminhoLegivel(rel) }))
    });
  }
  if (p && p.ramosSemAlvo.length) {
    avisos.push({
      tipo: 'info', chave: 'ramos',
      texto: 'Em ' + plural(p.ramosSemAlvo.length, 'pasta', 'pastas') + ' o caminho não chega até o fim.',
      detalhe: 'Pode ser normal (uma empresa que ainda não tem a pasta deste ano, por exemplo). Mas se forem muitas, talvez falte ou sobre um nível no caminho.',
      itens: p.ramosSemAlvo.map(r => ({
        rel: r.caminho,
        texto: caminhoLegivel(r.caminho),
        extra: 'não tem dentro: ' + listaFalada(r.esperado.map(s => minusculaInicial(resumoDoNivel(nivelDeSegmento(s)))), 'ou')
      }))
    });
  }
  if (p && p.alvosAninhados.length) {
    avisos.push({
      tipo: 'info', chave: 'aninhados',
      texto: plural(p.alvosAninhados.length, 'pasta monitorada fica', 'pastas monitoradas ficam') + ' dentro de outra pasta monitorada.',
      detalhe: 'Funciona, mas o cliente vai ver duas pastas ENVIADOS na mesma parte da árvore.',
      itens: p.alvosAninhados.map(a => ({ rel: a.caminho, texto: caminhoLegivel(a.caminho), extra: 'dentro de ' + caminhoLegivel(a.dentroDe) }))
    });
  }
  return avisos;
}

function detalhes(chave, resumo, conteudo) {
  return h('details', {
      open: S.detalhesAbertos.has(chave),
      ontoggle: ev => { if (ev.target.open) S.detalhesAbertos.add(chave); else S.detalhesAbertos.delete(chave); }
    },
    h('summary', {}, resumo), conteudo);
}

function listaDePastas(itens) {
  return h('ul', { class: 'lista-pastas' }, itens.slice(0, LIMITE_LISTA).map(item =>
    h('li', { class: 'clicavel', style: item.cor ? '--cor:' + item.cor : null, title: 'Mostrar na árvore', onclick: () => revelar(item.rel, true) },
      item.cor ? h('span', { class: 'bolinha' }) : null,
      h('span', {}, h('span', { class: 'caminho-txt' }, item.texto), item.extra ? h('span', { class: 'detalhe' }, ' — ' + item.extra) : null))));
}

function renderResultado() {
  preservandoFoco(desenharResultado);
}

function desenharResultado() {
  const box = $('#resultado');
  box.textContent = '';
  box.hidden = !S.caminhos.length;
  if (box.hidden) return;

  const r = resumoDoResultado();
  box.append(h('div', { class: 'resultado-topo' },
    h('div', { class: 'resultado-icone ' + r.tipo }, icone(r.icone, r.girando ? 'girando' : null)),
    h('div', {}, h('p', { class: 'resultado-titulo' }, r.titulo), h('p', { class: 'resultado-sub' }, r.sub))));

  const corpo = h('div', { class: 'resultado-corpo' });
  const avisos = avisosDoResultado();
  if (avisos.length) {
    corpo.append(h('ul', { class: 'avisos' }, avisos.map(a => h('li', {},
      h('div', { class: 'aviso-linha ' + a.tipo }, icone(a.tipo === 'erro' ? 'erro' : a.tipo === 'aviso' ? 'alerta' : 'info'),
        h('div', { class: 'aviso-texto' },
          a.caminho
            ? h('button', { class: 'link', onclick: () => { S.selecionado = a.caminho; S.nivelAberto = null; renderCaminhos(); renderArvore(); } }, a.texto)
            : a.texto,
          a.detalhe ? h('small', {}, a.detalhe) : null,
          a.itens ? detalhes('aviso-' + a.chave, 'ver ' + plural(a.itens.length, 'pasta', 'pastas'), listaDePastas(a.itens)) : null))))));
  }

  const p = S.previaStatus === 'pronta' ? S.previa : null;
  if (p && p.totalDeAlvos) {
    const alvoFiltro = normalizar(S.filtroAlvos);
    const itens = p.alvos
      .filter(a => !alvoFiltro || normalizar(a.caminho).includes(alvoFiltro))
      .map(a => {
        const id = (S.alvos.get(a.caminho) || [])[0];
        return { rel: a.caminho, texto: caminhoLegivel(a.caminho), cor: id !== undefined ? corDe(id) : null };
      });
    const conteudo = h('div', {},
      h('input', {
        type: 'search', class: 'filtro-lista', placeholder: 'filtrar pastas…', value: S.filtroAlvos, 'data-foco': 'filtro-alvos',
        oninput: ev => { S.filtroAlvos = ev.target.value; renderResultado(); }
      }),
      listaDePastas(itens),
      itens.length > LIMITE_LISTA || p.alvos.length < p.totalDeAlvos
        ? h('p', { class: 'dica', style: 'margin-top:6px' }, 'Mostrando ' + Math.min(itens.length, LIMITE_LISTA) + ' de ' + plural(p.totalDeAlvos, 'pasta', 'pastas') + '. Use o filtro para achar uma pasta específica.')
        : null);
    corpo.append(detalhes('alvos', 'Ver as ' + plural(p.totalDeAlvos, 'pasta monitorada', 'pastas monitoradas'), conteudo));
  }
  if (corpo.childNodes.length) box.append(corpo);
}

function renderRodape() {
  const r = resumoDoResultado();
  const resumo = $('#resumo');
  resumo.textContent = '';
  const avisos = avisosDoResultado().filter(a => a.tipo !== 'info').length;
  resumo.append(
    h('span', { class: 'resultado-icone ' + r.tipo }, icone(r.icone, r.girando ? 'girando' : null)),
    h('span', { class: 'resumo-texto' }, r.titulo));
  if (avisos) resumo.append(h('span', { class: 'resumo-avisos' }, plural(avisos, 'aviso', 'avisos')));

  const salvo = $('#estado-salvo');
  if (S.sujo) {
    salvo.className = 'salvo sujo';
    salvo.textContent = 'Alterações não salvas';
  } else if (S.salvouNestaSessao) {
    salvo.className = 'salvo limpo';
    salvo.textContent = 'Mapa salvo';
  } else {
    salvo.className = 'salvo';
    salvo.textContent = S.cfg && S.cfg.modoAtual === 'MAPA' ? 'Igual ao mapa salvo' : 'Ainda sem mapa';
  }
  $('#btn-salvar').disabled = !S.caminhos.length;
}

// =====================================================================================  acoes

function dialogo(opcoes) {
  return new Promise(resolve => {
    const d = h('dialog', { class: 'dialogo' });
    const fechar = valor => { d.close(); d.remove(); resolve(valor); };
    d.append(
      h('h2', {}, opcoes.titulo),
      h('div', { class: 'dialogo-corpo' }, opcoes.conteudo),
      h('div', { class: 'dialogo-botoes' }, opcoes.botoes.map(b =>
        h('button', { class: 'btn ' + (b.classe || ''), onclick: () => fechar(b.valor) }, b.texto))));
    d.addEventListener('cancel', ev => { ev.preventDefault(); fechar(null); });
    document.body.append(d);
    d.showModal();
    const primario = d.querySelector('.btn.primario');
    if (primario) primario.focus();
  });
}

function aviso(texto, tipo) {
  const t = h('div', { class: 'toast' + (tipo ? ' ' + tipo : ''), role: 'status' }, texto);
  $('#toasts').append(t);
  setTimeout(() => t.classList.add('saindo'), 5200);
  setTimeout(() => t.remove(), 5600);
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    const area = h('textarea', { style: 'position:fixed;opacity:0' });
    area.value = texto;
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
  }
  aviso('Texto copiado.', 'ok');
}

function verArquivo() {
  const gerado = gerarTexto();
  dialogo({
    titulo: 'Arquivo que será gravado',
    conteudo: [
      h('p', {}, 'Ao salvar, este texto vai para ', h('code', {}, 'mapa-pastas.txt'), ', na pasta do robô.'),
      gerado.incompletos.length
        ? h('p', { class: 'nota aviso' }, icone('alerta'), 'Ficam de fora, por estarem incompletos: ' + gerado.incompletos.map(c => aspas(nomeDe(c))).join(', ') + '.')
        : null,
      h('pre', { class: 'arquivo' }, gerado.texto)
    ],
    botoes: [{ texto: 'Copiar texto', valor: 'copiar' }, { texto: 'Fechar', classe: 'primario', valor: null }]
  }).then(v => { if (v === 'copiar') copiar(gerado.texto); });
}

async function salvar() {
  if (!S.caminhos.length) return;
  const gerado = gerarTexto();
  if (gerado.incompletos.length) {
    const c = gerado.incompletos[0];
    S.selecionado = c.id;
    S.nivelAberto = null;
    renderCaminhos();
    aviso('Termine o caminho ' + aspas(nomeDe(c)) + ' antes de salvar: ' + problemaDoCaminho(c) + '.', 'erro');
    return;
  }

  clearTimeout(relogioDaPrevia);
  S.previaStatus = 'calculando';
  renderDependentesDaPrevia();
  await rodarPrevia();
  if (S.errosPorCaminho.size) {
    const [id, erro] = S.errosPorCaminho.entries().next().value;
    S.selecionado = id;
    renderCaminhos();
    aviso('O robô não aceita o caminho ' + aspas(nomeDe(caminhoPorId(id))) + ': ' + erro, 'erro');
    return;
  }
  if (S.previaStatus !== 'pronta') {
    aviso('Não foi possível conferir o mapa antes de salvar: ' + (S.previaFalha || 'tente de novo.'), 'erro');
    return;
  }

  const total = S.previa.totalDeAlvos;
  const conteudo = [];
  if (total === 0) {
    conteudo.push(h('div', { class: 'caixa-erro' }, icone('alerta'), h('div', {},
      h('b', {}, 'Este mapa não encontra nenhuma pasta. '), 'Com ele o robô não enviaria nada. Salve só se tiver certeza.')));
  } else {
    conteudo.push(h('p', {}, 'O robô vai passar a monitorar ', h('b', {}, plural(total, 'pasta', 'pastas')), ', em ' + plural(S.caminhos.length, 'caminho', 'caminhos') + '.'));
  }
  if (S.cfg.modoAtual === 'NIVEIS') {
    conteudo.push(h('p', {}, 'Hoje o robô usa NIVEIS_SUBPASTA do parametros.txt. Depois de salvar, ele passa a usar só este mapa.'));
  }
  conteudo.push(h('p', {}, 'O robô começa a usar o novo mapa sozinho, em menos de um minuto — não precisa reiniciar nada. O mapa anterior fica guardado.'));
  const ok = await dialogo({
    titulo: 'Salvar o mapa?',
    conteudo,
    botoes: [{ texto: 'Cancelar', valor: false }, { texto: total === 0 ? 'Salvar mesmo assim' : 'Salvar', classe: total === 0 ? 'perigo' : 'primario', valor: true }]
  });
  if (!ok) return;

  let r;
  try {
    r = await chamar('POST', '/api/salvar', { texto: gerarTexto().texto });
  } catch (e) {
    aviso('Não foi possível salvar: ' + e.message, 'erro');
    return;
  }
  if (!r.salvo) {
    dialogo({ titulo: 'O mapa não foi salvo', conteudo: [h('p', {}, r.erro)], botoes: [{ texto: 'Fechar', classe: 'primario', valor: null }] });
    return;
  }
  S.sujo = false;
  S.salvouNestaSessao = true;
  try { S.cfg = await chamar('GET', '/api/estado'); } catch (e) { /* segue com o estado anterior */ }
  renderFaixas();
  renderTudo();
  aviso('Mapa salvo.' + (r.copiaAnterior ? ' A versão anterior ficou em ' + r.copiaAnterior + '.' : ''), 'ok');
}

async function atualizarPastas() {
  try {
    await chamar('POST', '/api/atualizar-pastas');
  } catch (e) {
    return;
  }
  S.arvore.clear();
  S.nomes.clear();
  for (const rel of S.abertas) carregarPasta(rel);
  renderTudo();
  agendarPrevia(0);
  aviso('Pastas lidas de novo.');
}

async function encerrar() {
  if (S.sujo) {
    const ok = await dialogo({
      titulo: 'Encerrar sem salvar?',
      conteudo: [h('p', {}, 'Há alterações que ainda não foram salvas no mapa-pastas.txt. Se encerrar agora, elas se perdem.')],
      botoes: [{ texto: 'Continuar editando', classe: 'primario', valor: false }, { texto: 'Encerrar sem salvar', classe: 'perigo', valor: true }]
    });
    if (!ok) return;
  }
  S.sujo = false;
  try { await chamar('POST', '/api/encerrar'); } catch (e) { /* ja estava fora */ }
  telaCheia('Mapeador encerrado', [h('p', {}, 'Pode fechar esta aba.'), h('p', {}, 'Para abrir de novo, rode o mapear.bat na pasta do robô.')]);
}

function telaCheia(titulo, conteudo) {
  if (document.getElementById('tela-cheia')) return;
  document.body.append(h('div', { class: 'tela-cheia', id: 'tela-cheia' }, h('div', { class: 'tela-caixa' }, h('h2', {}, titulo), conteudo)));
}

function mostrarDesconectado() {
  const conteudo = [h('p', {}, 'A janela preta do mapear.bat foi fechada, ou o mapeador encerrou sozinho depois de muito tempo parado. Para continuar, rode o mapear.bat de novo.')];
  if (S.sujo) {
    const texto = gerarTexto().texto;
    conteudo.push(h('p', {}, h('b', {}, 'As alterações não salvas ainda estão aqui. '), 'Copie o texto abaixo antes de fechar a aba — dá para colar no mapa-pastas.txt.'));
    const area = h('textarea', { readonly: true });
    area.value = texto;
    conteudo.push(area, h('p', {}, h('button', { class: 'btn', onclick: () => copiar(texto) }, icone('copiar'), 'Copiar texto')));
  }
  S.sujo = false;
  telaCheia('O mapeador não está mais respondendo', conteudo);
}

function mostrarSemToken() {
  telaCheia('Endereço incompleto', [
    h('p', {}, 'Abra o endereço completo que aparece na janela preta do mapear.bat — ele termina com um código depois do #.')]);
}

// =====================================================================================  inicio

async function iniciar() {
  document.getElementById('sem-js').remove();
  if (!TOKEN) { mostrarSemToken(); return; }
  try {
    S.cfg = await chamar('GET', '/api/estado');
  } catch (e) {
    return;
  }
  renderTopo();
  renderFaixas();
  if (S.cfg.textoMapa) S.caminhos = importar(S.cfg.textoMapa);
  carregarPasta('');
  renderTudo();
  if (S.caminhos.length) agendarPrevia(0);

  $('#btn-salvar').addEventListener('click', salvar);
  $('#btn-arquivo').addEventListener('click', verArquivo);
  $('#btn-atualizar').addEventListener('click', atualizarPastas);
  $('#btn-encerrar').addEventListener('click', encerrar);
  $('#resumo').addEventListener('click', () => $('#resultado').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  window.addEventListener('beforeunload', ev => { if (S.sujo) { ev.preventDefault(); ev.returnValue = ''; } });
  setInterval(() => { chamar('POST', '/api/ping').catch(() => {}); }, 60000);
}

iniciar();
</script>
